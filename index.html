<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Interactive sunflower artwork with p5.js Perlin noise.">
  <title>Sunflowers</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <!-- p5.js core library and sound library module. -->
  <script src="./libraries/p5.min.js"></script>
  <script src="./libraries/p5.sound.min.js"></script>
</head>
<body>
  <!-- Main page layout module. -->
  <main>
    <!-- Status display module. -->
    <header>
      <div class="brand">
        <span class="title">Sunflowers</span>
        <p id="notice" role="status">Click once to show the watering can, click again to pour water, and drag the sun to move it.</p>
      </div>
      <div class="phase"><span id="phase">Dawn</span><span id="day">DAY 01</span></div>
    </header>
    <!-- Artwork container module. -->
    <section id="artwork-shell" aria-label="Interactive sunflower artwork">
      <!-- Audio feedback module: audio_mechanic.js receives the real-time volume level and changes the width of audio-level. -->
      <span class="level" aria-label="Audio level">
      <span id="audio-level"></span>
      </span>
      <div id="artwork"></div>
      <!-- Sun and moon interaction module. -->
      <button id="sun" type="button" aria-label="The sun and the moon">
        <svg viewBox="-50 -50 100 100" aria-hidden="true">
          <defs>
            <radialGradient id="sun-halo-fill">
              <stop offset="50%" stop-color="#FFD56B" stop-opacity="0.4"/>
              <stop offset="100%" stop-color="#FFD56B" stop-opacity="0"/>
            </radialGradient>
            <radialGradient id="moon-halo-fill">
              <stop offset="50%" stop-color="#E4E9FF" stop-opacity="0.3"/>
              <stop offset="100%" stop-color="#E4E9FF" stop-opacity="0"/>
            </radialGradient>
            <mask id="moon-shape" maskUnits="userSpaceOnUse" x="-50" y="-50" width="100" height="100">
              <circle r="28" fill="white"/>
              <circle cx="13" cy="-8" r="24" fill="black"/>
            </mask>
          </defs>

          <!-- Celestial graphic module. -->
          <g id="sun-body">
            <circle r="48" fill="url(#sun-halo-fill)"/>
            <g id="sun-rays" stroke="#F4B23C" stroke-width="3.2" stroke-linecap="round">
              <line x1="0" y1="-37" x2="0" y2="-46"/>
              <line x1="0" y1="-37" x2="0" y2="-46" transform="rotate(30)"/>
              <line x1="0" y1="-37" x2="0" y2="-46" transform="rotate(60)"/>
              <line x1="0" y1="-37" x2="0" y2="-46" transform="rotate(90)"/>
              <line x1="0" y1="-37" x2="0" y2="-46" transform="rotate(120)"/>
              <line x1="0" y1="-37" x2="0" y2="-46" transform="rotate(150)"/>
              <line x1="0" y1="-37" x2="0" y2="-46" transform="rotate(180)"/>
              <line x1="0" y1="-37" x2="0" y2="-46" transform="rotate(210)"/>
              <line x1="0" y1="-37" x2="0" y2="-46" transform="rotate(240)"/>
              <line x1="0" y1="-37" x2="0" y2="-46" transform="rotate(270)"/>
              <line x1="0" y1="-37" x2="0" y2="-46" transform="rotate(300)"/>
              <line x1="0" y1="-37" x2="0" y2="-46" transform="rotate(330)"/>
            </g>
            <circle r="28" fill="#F8BE45"/>
            <circle r="28" fill="none" stroke="#FFE08A" stroke-width="3" opacity="0.7"/>
          </g>

          <g id="moon-body">
            <circle r="48" fill="url(#moon-halo-fill)"/>
            <g id="moon-dots" fill="#F6F0D8">
              <circle cy="-41" r="1.8"/>
              <circle cy="-41" r="1.8" transform="rotate(30)"/>
              <circle cy="-41" r="1.8" transform="rotate(60)"/>
              <circle cy="-41" r="1.8" transform="rotate(90)"/>
              <circle cy="-41" r="1.8" transform="rotate(120)"/>
              <circle cy="-41" r="1.8" transform="rotate(150)"/>
              <circle cy="-41" r="1.8" transform="rotate(180)"/>
              <circle cy="-41" r="1.8" transform="rotate(210)"/>
              <circle cy="-41" r="1.8" transform="rotate(240)"/>
              <circle cy="-41" r="1.8" transform="rotate(270)"/>
              <circle cy="-41" r="1.8" transform="rotate(300)"/>
              <circle cy="-41" r="1.8" transform="rotate(330)"/>
            </g>
            <g mask="url(#moon-shape)">
              <circle r="28" fill="#F6F0D8"/>
              <circle cx="-15" cy="7" r="3.6" fill="#DAD6BC"/>
              <circle cx="-9" cy="18" r="2.3" fill="#DAD6BC"/>
              <circle cx="-21" cy="-4" r="2.1" fill="#DAD6BC"/>
            </g>
            <circle r="28" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.35" mask="url(#moon-shape)"/>
          </g>
        </svg>
      </button>
    </section>
    <!-- Audio control module. -->
    <footer>
      
      <div class="buttons">
        <button id="sound" type="button">Play music</button>
        <button id="microphone" type="button">Microphone</button>
      </div>
    </footer>
  </main>
  <!-- Script integration module. -->
  <script src="perlin_randomness.js"></script>
  <script src="time_mechanic.js"></script>
  <script src="input_mechanic.js"></script>
  <script src="audio_mechanic.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
